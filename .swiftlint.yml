# SwiftLint configuration for Barosense.
# Conventions source: .claude/skills/swift_conventions/SKILL.md
# Tests/ relaxes the force-* rules via Tests/.swiftlint.yml (allowed outside app targets).

excluded:
  - .build
  - Barosense.xcodeproj

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - empty_count
  - first_where
  - sorted_first_last
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument
  - private_swiftui_state

# "No force-unwrap, no `try!`, no `as!` outside test targets" — hard rule, so error.
force_unwrapping:
  severity: error
force_try:
  severity: error
force_cast:
  severity: error
implicitly_unwrapped_optional:
  severity: error

# "File length: split above ~300 lines."
file_length:
  warning: 300
  error: 500

# "View bodies: extract a subview above ~60 lines" — approximated for all functions.
function_body_length:
  warning: 60
  error: 100

line_length:
  warning: 120
  error: 180
  ignores_urls: true

identifier_name:
  excluded: [i, j, n, x, y, id, dt]

custom_rules:
  shared_ui_free:
    name: "UI import in Shared/"
    regex: '^import (SwiftUI|UIKit|WatchKit)\b'
    included: "(^|/)Shared/.*\\.swift"
    message: "Shared/ must stay UI-free and testable without a device — no SwiftUI/UIKit/WatchKit imports."
    severity: error
  no_mainactor_task_hop:
    name: "Task { @MainActor } hop"
    regex: 'Task\s*\{\s*@MainActor'
    message: "Do not hop to the main actor inside Task to silence an isolation warning — fix ownership instead."
    severity: error
  no_new_combine:
    name: "Combine import"
    regex: '^import Combine\b'
    message: "No new Combine pipelines — wrap callbacks in AsyncStream / withCheckedContinuation."
    severity: warning
