name: docs

# Tier 0.5: builds the Material for MkDocs site and publishes it to GitHub Pages.
#
# Runs on ubuntu-latest and needs no Xcode. That is not an accident — the API reference
# generator (scripts/docs/swiftdoc/) reads Swift as text rather than through a toolchain,
# precisely so the docs can be built on a 1x-billing Linux runner.
#
# The build is `--strict`: a broken cross-link in a generated page is a generator bug, and
# a generator bug that only shows up as a 404 months later is worse than a red build now.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Only one deployment at a time; a superseded run is cancelled rather than racing.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to a commit SHA, never a tag — same rule as checks.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install toolchain
        run: pip install -r docs/requirements.txt

      # Mermaid renders in the reader's browser, so a broken diagram survives `mkdocs
      # build` and shows up as a red error box on the published page. Runs before the
      # build so the failure names the file rather than being found by a human later.
      - name: Check diagrams
        run: python3 scripts/docs/check_diagrams.py

      - name: Build
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    # Pull requests build the site but never publish it: a PR from a fork must not be able
    # to overwrite what is served at the project's own URL.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Use "Re-run all jobs" on a failed run and this step fails with "Multiple
      # artifacts named github-pages": a re-run keeps the run id, so the artifact from
      # the previous attempt survives and Build uploads a second one. Start a fresh run
      # (Run workflow / a new push) instead, or delete the stale artifact and re-run
      # only this job.
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
