name: Barosense

options:
  bundleIdPrefix: com.barosense
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Fill in before building on device / enabling WeatherKit + HealthKit.
    DEVELOPMENT_TEAM: ""

targets:

  Barosense:
    type: application
    platform: iOS
    sources:
      - path: Barosense
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barosense.app
        PRODUCT_NAME: Barosense
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Purpose strings. Keep them non-medical: tracking / personal patterns only.
        INFOPLIST_KEY_NSMotionUsageDescription: >-
          Barosense reads barometric pressure to track weather changes alongside your
          check-ins.
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          Barosense reads sleep and heart data to look for personal patterns between
          weather and how you feel. It stays on your device.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: >-
          Barosense saves your wellbeing check-ins to the Health app so they stay in one
          place.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Barosense uses your location to fetch the local pressure forecast.
    entitlements:
      path: Barosense/Barosense.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups:
          - group.com.barosense.shared
    dependencies:
      - target: BarosenseWatch
        embed: true

  BarosenseWatch:
    type: application
    platform: watchOS
    sources:
      - path: BarosenseWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barosense.app.watchkitapp
        PRODUCT_NAME: Barosense
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.barosense.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_NSMotionUsageDescription: >-
          Barosense reads barometric pressure from the Watch barometer to track weather
          changes alongside your check-ins.
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          Barosense reads sleep and heart data to look for personal patterns between
          weather and how you feel. It stays on your device.
    entitlements:
      path: BarosenseWatch/BarosenseWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.barosense.shared

  SharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SharedTests
    dependencies:
      - target: Barosense
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barosense.SharedTests

schemes:
  Barosense:
    build:
      targets:
        Barosense: all
        BarosenseWatch: all
    test:
      targets:
        - SharedTests
      gatherCoverageData: true
    run:
      config: Debug
