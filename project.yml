name: Barosense

options:
  bundleIdPrefix: com.barosense
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Makes the compiler emit a .stringsdata sidecar for every `LocalizedStringKey` and
    # `String(localized:)` literal, which is what lets Xcode keep Localizable.xcstrings in
    # step with the source. Without it a new key silently never reaches the catalogue and
    # ships untranslated.
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    # Fill in before building on device / enabling WeatherKit + HealthKit.
    DEVELOPMENT_TEAM: ""

targets:

  Barosense:
    type: application
    platform: iOS
    sources:
      - path: Barosense
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barosense.app
        PRODUCT_NAME: Barosense
        TARGETED_DEVICE_FAMILY: "1,2"
        # The asset catalogue holds two bitmaps and no more: the app icon, and the same
        # artwork as `Logo` for the mark on the terms step. Everything else the UI draws is
        # a path or a palette token. Both exceptions are the same artwork — a logo is not
        # something code should be redrawing — and neither is a screenshot or an
        # illustration; add one of those and this comment is wrong.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Hand-written base plist, merged with the INFOPLIST_KEY_* settings below. It holds
        # only the array-valued keys that cannot be expressed as a build setting —
        # BGTaskSchedulerPermittedIdentifiers and UIBackgroundModes.
        INFOPLIST_FILE: Barosense/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # One warm light theme, which is all Figma has — see Palette. Every surface in it is
        # a fixed hex, so under the dark appearance only the handful of system-drawn things
        # invert and they invert *onto* those fixed light surfaces: a TextField prompt drawn
        # by the system goes near-white on white, and the keyboard and the system share sheets
        # arrive dark against them. Pinned here rather than with `.preferredColorScheme` on
        # the root view, because the offenders are UIKit-backed (UIPickerView, the keyboard)
        # and this is the one switch they all read. Remove it the day Figma ships a dark
        # palette, not before.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        # Purpose strings. Keep them non-medical: tracking / personal patterns only.
        # Motion is requested on iOS only — the phone owns the barometer.
        INFOPLIST_KEY_NSMotionUsageDescription: >-
          Barosense reads barometric pressure to track weather changes alongside your
          check-ins.
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          Barosense reads your sleep, heart rate and blood oxygen to show them beside the
          pressure and to look for personal patterns between weather and how you feel. It
          stays on your device.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Barosense uses your location to fetch the local pressure forecast.
        # Asks for *coarse* location and never offers the user the precise option. The epochs
        # round every coordinate to 0.1° (~11 km) before storing it and WeatherKit's own grid
        # is coarser than a GPS fix, so precise location has no consumer here — and a
        # permission with no consumer is exactly what CLAUDE.md constraint 3 forbids. Also
        # written as a real Boolean rather than left to INFOPLIST_KEY_* string injection: see
        # Barosense/Info.plist, where the authoritative entry lives.
        INFOPLIST_KEY_NSLocationDefaultAccuracyReduced: YES
    entitlements:
      path: Barosense/Barosense.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups:
          - group.com.barosense.shared
    dependencies:
      - target: BarosenseWatch
        embed: true

  BarosenseWatch:
    type: application
    platform: watchOS
    sources:
      - path: BarosenseWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barosense.app.watchkitapp
        PRODUCT_NAME: Barosense
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.barosense.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        # No NSMotionUsageDescription. The watch never touches CoreMotion — it displays what
        # the phone measured. A purpose string for a permission nothing requests is a prompt
        # the user is asked to answer for no feature, which is the surgical-permissions rule
        # in CLAUDE.md applied to Motion rather than HealthKit.
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          Barosense reads your sleep, heart rate and blood oxygen to show them beside the
          pressure and to look for personal patterns between weather and how you feel. It
          stays on your device.
    entitlements:
      path: BarosenseWatch/BarosenseWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.barosense.shared

  SharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SharedTests
    dependencies:
      - target: Barosense
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barosense.SharedTests

schemes:
  Barosense:
    build:
      targets:
        Barosense: all
        BarosenseWatch: all
    test:
      targets:
        - SharedTests
      gatherCoverageData: true
    run:
      config: Debug
