name: Barosense

# Spelled out rather than left to XcodeGen's default, which produces exactly this pair.
# Naming them is what gives `settings.configs` below something to attach to, and it makes a
# third configuration an explicit decision instead of a side effect.
configs:
  Debug: debug
  Release: release

options:
  bundleIdPrefix: com.barosense
  createIntermediateGroups: true
  groupSortPosition: top
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Makes the compiler emit a .stringsdata sidecar for every `LocalizedStringKey` and
    # `String(localized:)` literal, which is what lets Xcode keep Localizable.xcstrings in
    # step with the source. Without it a new key silently never reaches the catalogue and
    # ships untranslated.
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    # Fill in before building on device / enabling WeatherKit + HealthKit.
    DEVELOPMENT_TEAM: ""
  # Per-configuration settings. Every value below is already Xcode's default for that
  # configuration — they are pinned here, and guarded in scripts/ci/check-project-manifest.sh,
  # for the same reason SWIFT_STRICT_CONCURRENCY is: the failure mode is somebody flipping one
  # in the Xcode UI to make a build succeed, and a generated .xcodeproj means that edit would
  # otherwise vanish on the next `xcodegen generate` with nothing recording that it happened.
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
    Release:
      # `@testable import` links against a module built with this on and re-exports every
      # `internal` symbol. Shipping a Release binary with it set would put the whole
      # persistence and risk surface — stores, erasers, model internals — into the public
      # symbol table of an app whose entire threat model is on-device.
      ENABLE_TESTABILITY: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      VALIDATE_PRODUCT: YES

targets:

  Barosense:
    type: application
    platform: iOS
    sources:
      - path: Barosense
        excludes:
          - PrivacyInfo.xcprivacy
      # Redundant, and kept anyway. XcodeGen 2.46.0 — the version pinned in
      # .github/workflows/tests.yml — already routes an unrecognised extension to Resources
      # through the `default` branch of SourceGenerator.getDefaultBuildPhase, so the glob
      # above picks this file up on its own. Naming the phase costs six lines and drops a
      # dependency on that fall-through staying put; what it guards against is a privacy
      # manifest missing from the bundle, which builds clean and is only caught at upload.
      # `excludes` above is what stops the glob adding the same file a second time.
      - path: Barosense/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barosense.app
        PRODUCT_NAME: Barosense
        TARGETED_DEVICE_FAMILY: "1,2"
        # The asset catalogue holds two bitmaps and no more: the app icon, and the same
        # artwork as `Logo` for the mark on the terms step. Everything else the UI draws is
        # a path or a palette token. Both exceptions are the same artwork — a logo is not
        # something code should be redrawing — and neither is a screenshot or an
        # illustration; add one of those and this comment is wrong.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Hand-written base plist, merged with the INFOPLIST_KEY_* settings below. It holds
        # the array-valued keys that cannot be expressed as a build setting and the launch-
        # screen dictionary whose named colour must exist before the SwiftUI tree does.
        INFOPLIST_FILE: Barosense/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # One warm light theme, which is all Figma has — see Palette. Every surface in it is
        # a fixed hex, so under the dark appearance only the handful of system-drawn things
        # invert and they invert *onto* those fixed light surfaces: a TextField prompt drawn
        # by the system goes near-white on white, and the keyboard and the system share sheets
        # arrive dark against them. Pinned here rather than with `.preferredColorScheme` on
        # the root view, because the offenders are UIKit-backed (UIPickerView, the keyboard)
        # and this is the one switch they all read. Remove it the day Figma ships a dark
        # palette, not before.
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        # Purpose strings. Keep them non-medical: tracking / personal patterns only.
        # Motion is requested on iOS only — the phone owns the barometer.
        INFOPLIST_KEY_NSMotionUsageDescription: >-
          Barosense reads barometric pressure to track weather changes alongside your
          check-ins.
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          Barosense reads your sleep, heart rate and blood oxygen to show them beside the
          pressure and to look for personal patterns between weather and how you feel. It
          stays on your device.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: >-
          Barosense uses your location to fetch the local pressure forecast.
        # Asks for *coarse* location and never offers the user the precise option. The epochs
        # round every coordinate to 0.1° (~11 km) before storing it and WeatherKit's own grid
        # is coarser than a GPS fix, so precise location has no consumer here — and a
        # permission with no consumer is exactly what CLAUDE.md constraint 3 forbids. Also
        # written as a real Boolean rather than left to INFOPLIST_KEY_* string injection: see
        # Barosense/Info.plist, where the authoritative entry lives.
        INFOPLIST_KEY_NSLocationDefaultAccuracyReduced: YES
    entitlements:
      path: Barosense/Barosense.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.weatherkit: true
    dependencies:
      - target: BarosenseWatch
        embed: true
      # A system framework, not a third-party dependency. Linked explicitly rather than left
      # to Swift's implicit import because `appintentsmetadataprocessor` keys off the link:
      # without it the build still compiles the intents and then reports "Metadata extraction
      # skipped. No AppIntents.framework dependency found." — the app ships with no shortcuts
      # and Siri knows nothing about them, with no error to say why.
      - sdk: AppIntents.framework

  BarosenseWatch:
    type: application
    platform: watchOS
    sources:
      - path: BarosenseWatch
        excludes:
          - PrivacyInfo.xcprivacy
      # Its own copy, for the reason in Barosense/PrivacyInfo.xcprivacy: the watch app is a
      # separate bundle and is scanned separately. Named explicitly, and excluded from the
      # glob, for the reason the iOS target's is.
      - path: BarosenseWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barosense.app.watchkitapp
        PRODUCT_NAME: Barosense
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.barosense.app
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        # No NSMotionUsageDescription. The watch never touches CoreMotion — it displays what
        # the phone measured. A purpose string for a permission nothing requests is a prompt
        # the user is asked to answer for no feature, which is the surgical-permissions rule
        # in CLAUDE.md applied to Motion rather than HealthKit.
        INFOPLIST_KEY_NSHealthShareUsageDescription: >-
          Barosense reads your sleep, heart rate and blood oxygen to show them beside the
          pressure and to look for personal patterns between weather and how you feel. It
          stays on your device.
    entitlements:
      path: BarosenseWatch/BarosenseWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  SharedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SharedTests
    dependencies:
      - target: Barosense
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barosense.SharedTests

schemes:
  Barosense:
    build:
      targets:
        Barosense: all
        BarosenseWatch: all
    test:
      targets:
        - SharedTests
      gatherCoverageData: true
    run:
      config: Debug
